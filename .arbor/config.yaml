# Arbor Configuration
# Project-level settings for the Arbor workflow system
#
# All values have sensible defaults. Only override what you need.

#-------------------------------------------------------------------------------
# Session Recording
#-------------------------------------------------------------------------------

# Commit message used when auto-committing journal/index changes
# after running add_session.py
session_commit_message: "chore: record journal"

# Maximum lines per journal file before rotating to a new one
max_journal_lines: 2000

#-------------------------------------------------------------------------------
# Session Auto-Commit
#-------------------------------------------------------------------------------

# Auto-commit behavior for session journal + task archive operations.
# - true (default): scripts auto-stage and auto-commit journal / task changes
#   after add_session.py / task.py archive runs.
# - false: scripts do not touch git. Files (journal-*.md, task archive moves)
#   are still written to disk; you decide whether to git add / commit.
#
# Use `false` if your project's .gitignore intentionally excludes `.arbor/`
# and you want session data kept local-only, or if you prefer to review
# staged changes manually before each commit.
#
# Accepts: true / false / yes / no / 1 / 0 / on / off (case-insensitive).
#
# session_auto_commit: true

#-------------------------------------------------------------------------------
# Task Lifecycle Hooks
#-------------------------------------------------------------------------------

# Shell commands to run after task lifecycle events.
# Each hook receives TASK_JSON_PATH environment variable pointing to task.json.
# Hook failures print a warning but do not block the main operation.
#
# hooks:
#   after_create:
#     - "echo 'Task created'"
#   after_start:
#     - "echo 'Task started'"
#   after_finish:
#     - "echo 'Task finished'"
#   after_archive:
#     - "echo 'Task archived'"

#-------------------------------------------------------------------------------
# Monorepo / Packages
#-------------------------------------------------------------------------------

# Declare packages for monorepo projects.
# Arbor auto-detects workspaces during `arbor init`, but you can also
# configure them manually here.
#
# packages:
#   frontend:
#     path: packages/frontend
#   backend:
#     path: packages/backend
#   docs:
#     path: docs-site
#     type: submodule
#   # For polyrepo / meta-repo layouts (independent .git in each subdir),
#   # mark the package with `git: true`. The runtime treats it as an
#   # independent repository for things like git-context display.
#   webapp:
#     path: ./webapp
#     git: true
packages:
  cli:
    path: packages/cli

# Default package used when --package is not specified.
default_package: cli

#-------------------------------------------------------------------------------
# Sub-agent context injection limits
#-------------------------------------------------------------------------------
# Caps how much task context (implement.jsonl / check.jsonl referenced files,
# plus contract.md / design.md / waves.md) gets inlined into a sub-agent's
# first prompt. Oversized files are truncated with a notice; once the total
# payload cap is reached, remaining files degrade to index lines (path +
# reason + size) instead of being inlined.
#
# All values are byte counts. `0` disables the corresponding limit.
#
# context_injection:
#   max_file_bytes: 32768        # per implement.jsonl / check.jsonl referenced file
#   max_artifact_bytes: 65536    # per task artifact (contract.md / design.md / waves.md)
#   max_total_bytes: 131072      # whole injected payload; overflow degrades to index lines

#-------------------------------------------------------------------------------
# Per-turn prompt injection
#-------------------------------------------------------------------------------
# Escape hatch for the per-turn <workflow-state> breadcrumb. When a user
# prompt contains the skip keyword as a standalone word (case-insensitive,
# word-boundary match — "no-arborfoo" does NOT count), the breadcrumb is
# skipped for that turn only. Does not affect SessionStart or sub-agent
# context injection.
#
# prompt_injection:
#   skip_keyword: "no-arbor"   # "" disables the escape hatch entirely

#-------------------------------------------------------------------------------
# Executors
#-------------------------------------------------------------------------------
# How `arbor.py run` executes a role: as an Orca worker (`type: orca`).
# `arbor.py run` starts the worker itself with `orca orchestration
# worker-start` in the dispatch's worktree; the worker writes its reply to
# the request's reply file and reports `worker_done`; `arbor.py sync` reads
# the workers' state from Orca and collects the settled ones.
#   command       the Orca CLI; an absolute path when it is not on PATH
#                 (macOS: /Applications/Orca.app/Contents/Resources/bin/orca)
#   agent         the Orca agent id every role starts as (codex, claude, omp, ...)
#   model/effort  optional `--model` / `--effort` of the launch (effort needs model)
#   roles         per-role overrides of agent / model / effort
#   timeout       bounds one dispatch; `sync` stops a worker past it
#   max_parallel  bounds simultaneous workers of one task (BUILD partitions,
#                 reader batches). CONTRACT explore/architect readers have no
#                 cap; the main agent chooses their scopes and fan-out.
#   keep_open     true: a finished worker stays open in Orca (default: Orca
#                 closes it shortly after it reports; its output stays readable)
# Permissions belong to Orca: set each agent's permission mode under
# Settings > Agents so that workers do not stop on prompts. The main agent
# must itself run inside Orca, and the repository must be added to Orca with
# non-Orca worktrees shown (`orca repo add`, `orca repo set
# --external-worktree-visibility show`).
executors:
  default: orca
  orca:
    type: orca
    command: /Applications/Orca.app/Contents/Resources/bin/orca
    agent: omp
    timeout: 90m
    max_parallel: 5
    keep_open: false
    # roles:
    #   explore:
    #     agent: omp
    #     model: "@worker"

#-------------------------------------------------------------------------------
# Gate
#-------------------------------------------------------------------------------
# Project-wide checks the driver runs at GATE level 0 (`arbor.py gate`), in
# the task worktree, before the contract's `auto` verification-map commands.
# Each entry is one shell command; a non-zero exit turns the gate red. Empty
# means only the verification map runs. Put the full test suite here: writer
# roles (implement / fix / simplify) run only the contract's targeted `auto`
# checks plus lint and typecheck before they commit, and GATE is the one place
# the whole suite runs.
#   commands:
#     - "pnpm lint"
#     - "pnpm typecheck"
#     - "pnpm test"
gate:
  commands:
    - "pnpm lint"
    - "pnpm typecheck"
    - "pnpm test"

#-------------------------------------------------------------------------------
# Task worktrees
#-------------------------------------------------------------------------------
# `task.py start` creates branch <branch_prefix><task> and its worktree at
# <root>/<task>, starting from the current HEAD. `root` is resolved relative
# to the main checkout; {repo} is its directory name. `setup` runs once in
# every new worktree (e.g. "pnpm install --offline --frozen-lockfile"); a
# non-zero exit fails the start.
worktree:
  root: "../{repo}-wt"
  setup: "pnpm install --offline"
  branch_prefix: "task/"


#-------------------------------------------------------------------------------
# Mandate
#-------------------------------------------------------------------------------
# Which human gates the main agent puts to the user, per tier: `ask` (stop and
# ask) or `auto` (proceed on its own). Gates: contract (approving contract.md),
# plausible (PLAUSIBLE review findings; auto = the driver records
# `decide skip`), merge (auto = `arbor.py finish` merges the task branch
# --no-ff into the base branch itself when it changes fewer than
# auto_merge_max_lines lines, stays within the partition paths, has no product
# commit after the last review PASS, the main checkout is on the base branch
# and clean, and the merge applies without conflict; otherwise it prints the
# merge command as usual). Merging into the base branch asks in every tier:
# set `merge: auto` only when the user opts in. A child of a parent task
# merges into the parent's integration branch without a gate; only the
# integration branch goes into the base branch, by a human. STOP (a round cap
# or no progress) and scope changes are always asked. One task overrides
# single gates with `task.py create --mandate "contract=auto,merge=ask"`.
# The values below are the defaults.
mandate:
  light:
    contract: auto
    plausible: auto
    merge: ask
  standard:
    contract: ask
    plausible: auto
    merge: ask
  full:
    contract: ask
    plausible: ask
    merge: ask
  auto_merge_max_lines: 200
