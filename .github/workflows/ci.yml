name: CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/cli/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '**/*.py'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/cli/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '**/*.py'
      - '.github/workflows/ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup minimum supported Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Check Python 3.9 syntax
        run: |
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/trellis-pycache"
          git ls-files -z '*.py' | xargs -0 python -m py_compile

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck Python
        run: pnpm --filter @tony131143a/arbor lint:py

      - name: Lint
        run: pnpm lint

      # Build before test: integration tests spawn the real CLI via
      # bin/arbor.js, which imports dist/ and needs build output to exist.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Verify build output
        run: |
          set -euo pipefail
          test -d packages/cli/dist
          test -f packages/cli/dist/index.js
          echo "Build verification passed"
