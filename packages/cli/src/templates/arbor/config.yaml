# Arbor Configuration
# Project-level settings for the Arbor workflow system
#
# All values have sensible defaults. Only override what you need.

#-------------------------------------------------------------------------------
# Session Recording
#-------------------------------------------------------------------------------

# Commit message used when auto-committing journal/index changes
# after running add_session.py
session_commit_message: "chore: record journal"

# Maximum lines per journal file before rotating to a new one
max_journal_lines: 2000

#-------------------------------------------------------------------------------
# Session Auto-Commit
#-------------------------------------------------------------------------------

# Auto-commit behavior for session journal operations.
# - true (default): add_session.py auto-stages and auto-commits the journal
#   changes it writes.
# - false: add_session.py does not touch git. The journal files are still
#   written to disk; you decide whether to git add / commit.
#
# Use `false` if your project's .gitignore intentionally excludes `.arbor/`
# and you want session data kept local-only, or if you prefer to review
# staged changes manually before each commit.
#
# Accepts: true / false / yes / no / 1 / 0 / on / off (case-insensitive).
#
# session_auto_commit: true

#-------------------------------------------------------------------------------
# Monorepo / Packages
#-------------------------------------------------------------------------------

# Declare packages for monorepo projects.
# Arbor auto-detects workspaces during `arbor init`, but you can also
# configure them manually here.
#
# packages:
#   frontend:
#     path: packages/frontend
#   backend:
#     path: packages/backend
#   docs:
#     path: docs-site
#     type: submodule
#   # For polyrepo / meta-repo layouts (independent .git in each subdir),
#   # mark the package with `git: true`. A node file names it as its `repo`;
#   # the driver adds every repository a task touches to Orca itself.
#   webapp:
#     path: ./webapp
#     git: true
#     # Optional: where the task's integration branch starts and what it is
#     # merged into. The package's `execution` section replaces the control
#     # repository's gate and worktree settings for this repository.
#     execution:
#       base_ref: origin/dev
#       merge_target: dev

# Package that journal entries are tagged with when none is given.
# default_package: frontend

#-------------------------------------------------------------------------------
# Executors
#-------------------------------------------------------------------------------
# How the driver runs a node: as an Orca worker (`type: orca`). `arbor.py sync`
# starts every ready node with `orca orchestration worker-start` in the node's
# own Orca worktree (in the task's Orca Run), reads the workers' state from
# Orca and merges the finished ones.
#   command       the Orca CLI; an absolute path when it is not on PATH
#                 (macOS: /Applications/Orca.app/Contents/Resources/bin/orca)
#   agent         the Orca agent id of the `strong` tier, the default of every
#                 node (codex, claude, omp, ...); model and reasoning effort
#                 are the agent's own settings in Orca
#   tiers         more tiers a node can name with `tier: <name>`, each with
#                 its own agent (example below); `light` without an entry
#                 runs on `agent`
#   timeout       bounds one node; `sync` stops a worker past it
#   max_parallel  bounds simultaneous workers of one task
#   max_nodes     bounds the nodes of one task (default 30); `arbor.py resume`
#                 grants more
#   keep_open     true: a finished worker stays open in Orca (default: Orca
#                 closes it shortly after it reports; its output stays readable)
# Permissions belong to Orca: set each agent's permission mode under
# Settings > Agents so that workers do not stop on prompts. The main agent
# must itself run inside Orca. Orca creates worktrees only for its projects:
# the driver adds the repositories a task touches itself (`orca repo add`).
executors:
  default: orca
  orca:
    type: orca
    command: orca
    agent: codex
    timeout: 90m
    max_parallel: 5
    keep_open: false
    # max_nodes: 30
    # tiers:
    #   light:            # mechanical edits a check proves; a cheaper agent
    #     agent: omp
    #   review:           # reviewer nodes of `arbor.py review`; an agent
    #     agent: claude   # other than the writers'

#-------------------------------------------------------------------------------
# Gate
#-------------------------------------------------------------------------------
# Project-wide checks the driver runs on the task's integration branch once
# nothing is running any more. Each entry is one shell command; a non-zero
# exit turns the gate red. The contract's `auto` verification-map commands run
# after them. Empty means only the verification map runs. Put the full test
# suite here: the gate on the merged result is the one place the whole suite
# runs.
#   commands:
#     - "pnpm lint"
#     - "pnpm typecheck"
#     - "pnpm test"
gate:
  commands: []

#-------------------------------------------------------------------------------
# Task worktrees
#-------------------------------------------------------------------------------
# Every task gets an integration branch <branch_prefix><task> and every node
# its own branch and worktree cut from it. Orca creates the worktrees (`orca
# worktree create`) and chooses their paths; Orca's own setup hooks follow the
# repository's policy in Orca. `setup` runs once in every new worktree and is
# waited for (e.g. "pnpm install --offline --frozen-lockfile"); a non-zero exit
# fails the node.
# `branch_prefix` defaults to "arbor/"; set another one (e.g. "task/") when
# the repository already has a branch named `arbor`, which blocks
# `arbor/<task>` refs.
worktree:
  setup: ""
  branch_prefix: "arbor/"

