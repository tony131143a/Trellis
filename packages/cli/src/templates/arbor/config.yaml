# Arbor Configuration
# Project-level settings for the Arbor workflow system
#
# All values have sensible defaults. Only override what you need.

#-------------------------------------------------------------------------------
# Session Recording
#-------------------------------------------------------------------------------

# Commit message used when auto-committing journal/index changes
# after running add_session.py
session_commit_message: "chore: record journal"

# Maximum lines per journal file before rotating to a new one
max_journal_lines: 2000

#-------------------------------------------------------------------------------
# Session Auto-Commit
#-------------------------------------------------------------------------------

# Auto-commit behavior for session journal + task archive operations.
# - true (default): scripts auto-stage and auto-commit journal / task changes
#   after add_session.py / task.py archive runs.
# - false: scripts do not touch git. Files (journal-*.md, task archive moves)
#   are still written to disk; you decide whether to git add / commit.
#
# Use `false` if your project's .gitignore intentionally excludes `.arbor/`
# and you want session data kept local-only, or if you prefer to review
# staged changes manually before each commit.
#
# Accepts: true / false / yes / no / 1 / 0 / on / off (case-insensitive).
#
# session_auto_commit: true

#-------------------------------------------------------------------------------
# Task Lifecycle Hooks
#-------------------------------------------------------------------------------

# Shell commands to run after task lifecycle events.
# Each hook receives TASK_JSON_PATH environment variable pointing to task.json.
# Hook failures print a warning but do not block the main operation.
#
# hooks:
#   after_create:
#     - "echo 'Task created'"
#   after_start:
#     - "echo 'Task started'"
#   after_finish:
#     - "echo 'Task finished'"
#   after_archive:
#     - "echo 'Task archived'"

#-------------------------------------------------------------------------------
# Monorepo / Packages
#-------------------------------------------------------------------------------

# Declare packages for monorepo projects.
# Arbor auto-detects workspaces during `arbor init`, but you can also
# configure them manually here.
#
# packages:
#   frontend:
#     path: packages/frontend
#   backend:
#     path: packages/backend
#   docs:
#     path: docs-site
#     type: submodule
#   # For polyrepo / meta-repo layouts (independent .git in each subdir),
#   # mark the package with `git: true`. The runtime treats it as an
#   # independent repository for things like git-context display.
#   webapp:
#     path: ./webapp
#     git: true
#     # Optional: defaults for `task.py start` of a task in this package
#     # (`--base-ref` / `--merge-target` override them).
#     execution:
#       base_ref: origin/dev
#       merge_target: dev

# Default package used when --package is not specified. A git: true package
# is never inherited: such tasks run in the control repo (execution control).
# default_package: frontend

#-------------------------------------------------------------------------------
# Sub-agent context injection limits
#-------------------------------------------------------------------------------
# Caps how much task context (implement.jsonl / check.jsonl referenced files,
# plus contract.md / design.md / waves.md) gets inlined into a sub-agent's
# first prompt. Oversized files are truncated with a notice; once the total
# payload cap is reached, remaining files degrade to index lines (path +
# reason + size) instead of being inlined.
#
# All values are byte counts. `0` disables the corresponding limit.
#
# context_injection:
#   max_file_bytes: 32768        # per implement.jsonl / check.jsonl referenced file
#   max_artifact_bytes: 65536    # per task artifact (contract.md / design.md / waves.md)
#   max_total_bytes: 131072      # whole injected payload; overflow degrades to index lines

#-------------------------------------------------------------------------------
# Per-turn prompt injection
#-------------------------------------------------------------------------------
# Escape hatch for the per-turn <workflow-state> breadcrumb. When a user
# prompt contains the skip keyword as a standalone word (case-insensitive,
# word-boundary match — "no-arborfoo" does NOT count), the breadcrumb is
# skipped for that turn only. Does not affect SessionStart or sub-agent
# context injection.
#
# prompt_injection:
#   skip_keyword: "no-arbor"   # "" disables the escape hatch entirely

#-------------------------------------------------------------------------------
# Executors
#-------------------------------------------------------------------------------
# How `arbor.py run` executes a role. The default is a `command` executor
# running `codeg-cli`: the driver starts the child, waits for its reply and
# validates it itself (put codeg-cli on PATH or write its absolute path).
# Placeholders: {role} {prompt} {worktree} {task} {dispatch}. Model, effort and
# permissions belong to the executor, not to Arbor: with codeg, configure one
# `arbor-<role>` assistant per role. `timeout` bounds one dispatch;
# max_parallel bounds simultaneous BUILD partition workers only. CONTRACT
# explore/architect readers have no total or simultaneous cap; the Planner
# chooses their scopes, angles and fan-out.
#
# `codeg` (type codeg-mcp) is the host-driven alternative: `arbor.py run`
# prepares a delegate_to_agent request, the host session calls codeg MCP,
# binds the task_id and collects the terminal report. Optional assistant_ids
# maps role names to codeg assistant ids; without it the host resolves
# `assistant` from the MCP roster. Pick it with `executors.default: codeg` or
# `arbor.py --executor codeg`.
#
# Other command executors (copy one, then point `default` at it):
#   claude:
#     command: "claude -p < {prompt}"
#   codex:
#     command: "codex exec --cd {worktree} --sandbox workspace-write - < {prompt}"
executors:
  default: codeg
  codeg-cli:
    type: command
    command: "codeg-cli run -A arbor-{role} -w {worktree} --permissions allow --timeout 90m --title arbor-{role}-{task}-{dispatch} -q -p - < {prompt}"
    timeout: 95m
    max_parallel: 3
  codeg:
    type: codeg-mcp
    assistant: "arbor-{role}"
    timeout: 90m
    max_parallel: 3

#-------------------------------------------------------------------------------
# Gate
#-------------------------------------------------------------------------------
# Project-wide checks the driver runs at GATE level 0 (`arbor.py gate`), in
# the task worktree, before the contract's `auto` verification-map commands.
# Each entry is one shell command; a non-zero exit turns the gate red. Empty
# means only the verification map runs.
#   commands:
#     - "pnpm lint"
#     - "pnpm typecheck"
gate:
  commands: []

#-------------------------------------------------------------------------------
# Mandate
#-------------------------------------------------------------------------------
# Which human gates the main agent puts to the user, per tier: `ask` (stop and
# ask) or `auto` (proceed on its own). Gates: contract (approving contract.md),
# plausible (PLAUSIBLE findings after verify; auto = the driver records
# `decide skip`), stop (a round cap or no progress; auto = the driver resumes
# once per counter, the second trip still asks), merge (auto = `arbor.py
# finish` merges the task branch --no-ff itself when it changes fewer than
# auto_merge_max_lines lines, the main checkout is on the base branch and
# clean, and the merge applies without conflict; otherwise it prints the merge
# command as usual). Scope changes are always asked. One task overrides single
# gates with `task.py create --mandate "contract=auto,merge=ask"`.
# The values below are the defaults.
mandate:
  light:
    contract: auto
    plausible: auto
    stop: auto
    merge: auto
  standard:
    contract: ask
    plausible: auto
    stop: auto
    merge: ask
  full:
    contract: ask
    plausible: ask
    stop: ask
    merge: ask
  auto_merge_max_lines: 200

#-------------------------------------------------------------------------------
# Task worktrees
#-------------------------------------------------------------------------------
# `task.py start` creates branch <branch_prefix><task> and its worktree at
# <root>/<task>, starting from the current HEAD. `root` is resolved relative
# to the main checkout; {repo} is its directory name. `setup` runs once in
# every new worktree (e.g. "pnpm install --offline --frozen-lockfile"); a
# non-zero exit fails the start. `branch_prefix` defaults to "arbor/"; set
# another one (e.g. "task/") when the repository already has a branch named
# `arbor`, which blocks `arbor/<task>` refs.
worktree:
  root: "../{repo}-wt"
  setup: ""
  branch_prefix: "arbor/"

#-------------------------------------------------------------------------------
# Test paths
#-------------------------------------------------------------------------------
# Globs (`**` allowed) the `test` role may write and the implementing roles
# may not. A contract's own `## Test paths` section takes precedence.
test_paths:
  - "packages/*/test/**"
  - "**/*.test.ts"
