# Arbor Configuration
# Project-level settings for the Arbor workflow system
#
# All values have sensible defaults. Only override what you need.

#-------------------------------------------------------------------------------
# Session Recording
#-------------------------------------------------------------------------------

# Commit message used when auto-committing journal/index changes
# after running add_session.py
session_commit_message: "chore: record journal"

# Maximum lines per journal file before rotating to a new one
max_journal_lines: 2000

#-------------------------------------------------------------------------------
# Session Auto-Commit
#-------------------------------------------------------------------------------

# Auto-commit behavior for session journal + task archive operations.
# - true (default): scripts auto-stage and auto-commit journal / task changes
#   after add_session.py / task.py archive runs.
# - false: scripts do not touch git. Files (journal-*.md, task archive moves)
#   are still written to disk; you decide whether to git add / commit.
#
# Use `false` if your project's .gitignore intentionally excludes `.arbor/`
# and you want session data kept local-only, or if you prefer to review
# staged changes manually before each commit.
#
# Accepts: true / false / yes / no / 1 / 0 / on / off (case-insensitive).
#
# session_auto_commit: true

#-------------------------------------------------------------------------------
# Task Lifecycle Hooks
#-------------------------------------------------------------------------------

# Shell commands to run after task lifecycle events.
# Each hook receives TASK_JSON_PATH environment variable pointing to task.json.
# Hook failures print a warning but do not block the main operation.
#
# hooks:
#   after_create:
#     - "echo 'Task created'"
#   after_start:
#     - "echo 'Task started'"
#   after_finish:
#     - "echo 'Task finished'"
#   after_archive:
#     - "echo 'Task archived'"

#-------------------------------------------------------------------------------
# Monorepo / Packages
#-------------------------------------------------------------------------------

# Declare packages for monorepo projects.
# Arbor auto-detects workspaces during `arbor init`, but you can also
# configure them manually here.
#
# packages:
#   frontend:
#     path: packages/frontend
#   backend:
#     path: packages/backend
#   docs:
#     path: docs-site
#     type: submodule
#   # For polyrepo / meta-repo layouts (independent .git in each subdir),
#   # mark the package with `git: true`. The runtime treats it as an
#   # independent repository for things like git-context display.
#   webapp:
#     path: ./webapp
#     git: true

# Default package used when --package is not specified.
# default_package: frontend

#-------------------------------------------------------------------------------
# Sub-agent context injection limits
#-------------------------------------------------------------------------------
# Caps how much task context (implement.jsonl / check.jsonl referenced files,
# plus prd.md / design.md / implement.md) gets inlined into a sub-agent's
# first prompt. Oversized files are truncated with a notice; once the total
# payload cap is reached, remaining files degrade to index lines (path +
# reason + size) instead of being inlined.
#
# All values are byte counts. `0` disables the corresponding limit.
#
# context_injection:
#   max_file_bytes: 32768        # per implement.jsonl / check.jsonl referenced file
#   max_artifact_bytes: 65536    # per task artifact (prd.md / design.md / implement.md)
#   max_total_bytes: 131072      # whole injected payload; overflow degrades to index lines

#-------------------------------------------------------------------------------
# Per-turn prompt injection
#-------------------------------------------------------------------------------
# Escape hatch for the per-turn <workflow-state> breadcrumb. When a user
# prompt contains the skip keyword as a standalone word (case-insensitive,
# word-boundary match — "no-arborfoo" does NOT count), the breadcrumb is
# skipped for that turn only. Does not affect SessionStart or sub-agent
# context injection.
#
# prompt_injection:
#   skip_keyword: "no-arbor"   # "" disables the escape hatch entirely

#-------------------------------------------------------------------------------
# Dispatch (codeg assistants)
#-------------------------------------------------------------------------------
# The seven roles (explore, architect, implement, review, verify, fix,
# simplify) run as codeg assistants, never as the host's
# built-in Agent/Task tool. The effective target is resolved at runtime:
# .arbor/.runtime/dispatch-target > ARBOR_DISPATCH_TARGET > default_target.
# Role names sit directly under each target; `mode_id` picks the agent's
# session mode (codex: agent-full-access | workspace-write | read-only); any
# other scalar key (model, thought_level) is passed as an agent option.
# `dispatch.py codeg-setup --install` creates missing assistants from these
# values and only refreshes the instructions of existing ones: the agent,
# mode and options of an existing assistant are edited in the codeg UI.
dispatch:
  default_target: star
  max_parallel: 3
  guard_builtin_agent: true
  hook_decision: allow
  codeg_cli: ""
  permissions: allow
  timeout: 90m
  targets:
    star:
      agent_type: "custom:star"
      explore: arbor-explore-star
      architect: arbor-architect-star
      implement: arbor-implement-star
      review: arbor-review-star
      verify: arbor-verify-star
      fix: arbor-fix-star
      simplify: arbor-simplify-star
    pi:
      agent_type: pi
      model: deepseek/DeepSeek-V4.1-Flash
      thought_level: max
      explore: arbor-explore-pi
      architect: arbor-architect-pi
      implement: arbor-implement-pi
      review: arbor-review-pi
      verify: arbor-verify-pi
      fix: arbor-fix-pi
      simplify: arbor-simplify-pi
    codex:
      agent_type: codex
      mode_id: agent-full-access
      explore: arbor-explore-codex
      architect: arbor-architect-codex
      implement: arbor-implement-codex
      review: arbor-review-codex
      verify: arbor-verify-codex
      fix: arbor-fix-codex
      simplify: arbor-simplify-codex

#-------------------------------------------------------------------------------
# Task worktrees
#-------------------------------------------------------------------------------
# `task.py start` creates branch arbor/<task> and its worktree at
# <root>/<task>, starting from the current HEAD. `root` is resolved relative
# to the main checkout; {repo} is its directory name. `setup` runs once in
# every new worktree (e.g. "pnpm install --offline --frozen-lockfile"); a
# non-zero exit fails the start.
worktree:
  root: "../{repo}-wt"
  setup: ""

#-------------------------------------------------------------------------------
# Test paths
#-------------------------------------------------------------------------------
# Globs (`**` allowed) the `test` role may write and the implementing roles
# may not. A contract's own `## Test paths` section takes precedence.
test_paths:
  - "packages/*/test/**"
  - "**/*.test.ts"
